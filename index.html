
<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoForge AI | 神经软件工厂</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
      
      :root {
        --bg-main: #020617;
        --bg-sidebar: rgba(15, 23, 42, 0.6);
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --glass-bg: rgba(15, 23, 42, 0.85);
        --glass-border: rgba(255, 255, 255, 0.08);
        --panel-bg: rgba(15, 23, 42, 0.7);
        --input-bg: rgba(2, 6, 23, 0.9);
        --accent-primary: #3b82f6;
        --accent-secondary: #6366f1;
        --card-bg: rgba(30, 41, 59, 0.5);
      }

      body {
        font-family: 'Plus Jakarta Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        line-height: 1.6;
        height: 100vh;
        margin: 0;
      }

      .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: blur(24px);
        border: 1px solid var(--glass-border);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .gradient-text {
        background: linear-gradient(135deg, #3b82f6 0%, #a855f7 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      button, input, textarea, div {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      html { background-color: #020617; }
    </style>

  }
}
</script>
